<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Autopilot</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/projects" aria-label="Dev Autopilot home">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M9 22l7-13 7 13h-4l-3-6-3 6z" fill="var(--bg)"/></svg>
      <span>Dev Autopilot</span>
    </a>
    <label class="switcher">
      <span class="sr-only">Project</span>
      <select id="project-switch" aria-label="Project"></select>
    </label>
    <a id="status-chip" class="chip" href="#/projects" hidden></a>
    <span class="spacer"></span>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch light and dark theme" title="Switch theme">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
  <main id="view" tabindex="-1"></main>
  <dialog id="dialog"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
