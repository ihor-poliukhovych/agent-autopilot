name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. autopilot ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: "autopilot --version, Windows 11 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `autopilot doctor` and the failing command. Remove secrets first.
      render: text
