name: PR title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|refactor|test|perf|build|ci|chore)(\([a-z0-9-]+\))?!?: [a-z0-9].{0,71}$'
          printf '%s' "$TITLE" | grep -Eq "$pattern" || { echo "Title must look like 'type(scope): subject' (see CONTRIBUTING.md): $TITLE"; exit 1; }
